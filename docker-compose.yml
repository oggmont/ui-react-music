# The web UI in Docker, next to the API (restapi-spring-music, container "music-api") and the
# database (db-postgresql-music). All three share the database's network, so the UI reaches the
# API by container name.
#
#   docker compose up -d --build          dev server with hot reload: http://localhost:5173
#   docker compose --profile prod up -d   production image (nginx):   http://localhost:8082
name: music-ui

services:
  ui:
    build:
      context: .
      target: dev
    image: ui-react-music:dev
    container_name: music-ui
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: ${API_DOCKER_TARGET:-http://music-api:8080}
      WATCH_POLLING: ${WATCH_POLLING:-false}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      - '${UI_PORT:-5173}:5173'
    volumes:
      # The source is mounted for hot reload; node_modules stays the image's (Linux) copy.
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - music-db

  ui-prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    image: ui-react-music:latest
    container_name: music-ui-prod
    restart: unless-stopped
    environment:
      API_UPSTREAM: ${API_DOCKER_TARGET:-http://music-api:8080}
    ports:
      - '${UI_PROD_PORT:-8082}:8080'
    networks:
      - music-db

volumes:
  node_modules:

networks:
  music-db:
    # Created by db-postgresql-music's docker compose (project "music-db").
    name: ${MUSIC_DB_NETWORK:-music-db_default}
    external: true
