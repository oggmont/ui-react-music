# CI/CD for the web UI.
#   Pull requests and pushes: lint, format check, unit tests and build (npm run check).
#   Pushes to main (or a manual run): build the nginx image, push it to Artifact Registry and
#   deploy it to Cloud Run as "runlist-ui".
# GCP access is keyless (Workload Identity Federation); the infrastructure is created by
# db-postgresql-runlist/deploy/gcp/setup.sh. GitHub Actions is free for public repositories.
name: CI/CD

on:
  push:
    branches: [main]
    # Docs-only pushes don't redeploy prod (keep prod usage, and the bill, at the minimum).
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_ID: runlist-514701
  REGION: us-central1
  SERVICE: runlist-ui
  IMAGE: us-central1-docker.pkg.dev/runlist-514701/runlist/ui
  # Cloud Run URL of the API (https://<service>-<project number>.<region>.run.app)
  API_URL: https://runlist-api-894040023319.us-central1.run.app
  WIF_PROVIDER: projects/894040023319/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER: github-deployer@runlist-514701.iam.gserviceaccount.com

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-ui
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build-record artifact: on a public repo anyone could download the build logs.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          target: prod
          push: true
          # One manifest per image (no attestations), so the "keep 2 newest" cleanup counts images
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scales to zero and bills per request, so it stays in Cloud Run's free tier. Its public
      # access (allUsers invoker) was granted once by setup.sh; deploys keep it. All its outbound
      # traffic goes through the VPC (Direct VPC egress, no cost), which is the only way to reach
      # the API: the API only accepts internal traffic.
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account "runlist-ui@$PROJECT_ID.iam.gserviceaccount.com" \
            --port 8080 --cpu 1 --memory 256Mi \
            --min-instances 0 --max-instances 2 --concurrency 80 --cpu-throttling \
            --timeout 60 \
            --network default --subnet default --vpc-egress all-traffic \
            --set-env-vars "API_UPSTREAM=$API_URL" \
            --labels app=runlist,component=ui \
            --quiet
          echo "Deployed: $(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format 'value(status.url)')" >> "$GITHUB_STEP_SUMMARY"
